[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "factory_bot"
authors = [{name = "Daniel Pepper"}]
dynamic = ["version"]
description = "Test data factories with the ergonomics of Ruby's factory_bot"
readme = "README.md"
license = {file = "LICENSE.txt"}
classifiers = [
  # https://pypi.python.org/pypi?%3Aaction=list_classifiers
  "License :: OSI Approved :: MIT License",
]
requires-python = ">= 3.10"
dependencies = []

[project.optional-dependencies]
faker = ["faker"]
django = ["django"]
sqlalchemy = ["sqlalchemy >= 2"]
test = [
  "pytest >= 8.2",
  "ruff",
  "faker",
  "django",
  "sqlalchemy >= 2",
]

[project.urls]
Homepage = "https://github.com/dpep/py_factory_bot"

[tool.setuptools]
packages = ["factory_bot"]

[tool.setuptools.dynamic]
version = {attr = "factory_bot.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
