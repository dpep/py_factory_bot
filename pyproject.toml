[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "factory_bot"
dynamic = ["version"]
description = "Generate realistic test data with ease"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Daniel Pepper" }]
requires-python = ">= 3.11"
dependencies = ["faker"]
keywords = ["testing", "factories", "fixtures", "factory_bot"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.entry-points.pytest11]
factory_bot = "factory_bot.pytest_plugin"

[project.urls]
Homepage = "https://github.com/dpep/py_factory_bot"
Issues = "https://github.com/dpep/py_factory_bot/issues"
Changelog = "https://github.com/dpep/py_factory_bot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest >= 8.2",
  "pytest-randomly",
  "coverage[toml]",
  "ruff",
  "pyright[nodejs]",  # the nodejs extra ships node as a wheel, so no system node is needed
  "django",
  "sqlalchemy >= 2.1.5",
]

[tool.hatch.version]
path = "src/factory_bot/__init__.py"

# Allowlist so untracked local files never ship.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE.txt", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["factory_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 99

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
include = ["src", "tests/test_typing.py"]
reportUnnecessaryTypeIgnoreComment = true
