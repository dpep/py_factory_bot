[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "factory_bot"
dynamic = ["version"]
description = "Test data factories with the ergonomics of Ruby's factory_bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Daniel Pepper" }]
requires-python = ">= 3.11"
dependencies = []
keywords = ["testing", "factories", "fixtures", "factory_bot"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.optional-dependencies]
faker = ["faker"]
django = ["django"]
sqlalchemy = ["sqlalchemy >= 2"]

[project.urls]
Homepage = "https://github.com/dpep/py_factory_bot"
Issues = "https://github.com/dpep/py_factory_bot/issues"
Changelog = "https://github.com/dpep/py_factory_bot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest >= 8.2",
  "ruff",
  "faker",
  "django",
  "sqlalchemy >= 2",
]

[tool.hatch.version]
path = "src/factory_bot/__init__.py"

# Allowlist so untracked local files never ship.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE.txt", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
