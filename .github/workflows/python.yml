name: Python

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}${{ matrix.deps == 'lowest' && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
        deps: [ latest ]
        include:
          - python-version: '3.11'
            deps: lowest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group dev
    - if: matrix.deps == 'lowest'
      run: pip install "faker==23.2.*"  # the floor in pyproject.toml
    - if: matrix.deps == 'lowest'
      run: python -m pytest -q  # old Faker's type hints differ; the floor is a runtime promise
    - if: matrix.deps != 'lowest'
      run: script/check.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/factory_bot
    permissions:
      id-token: write  # trusted publishing

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: build package
      run: |
        pip install build
        python -m build
    - uses: pypa/gh-action-pypi-publish@release/v1

permissions:
  contents: read
